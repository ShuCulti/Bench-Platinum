services:
  db:
    restart: unless-stopped
    image: postgres:17
    environment:
      POSTGRES_DB: platinum_bench
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "platinum_bench"]
      interval: 5s
      timeout: 5s
      retries: 10
      
  backend:
    restart: unless-stopped
    build: ./platinum-bench-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/platinum_bench
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: