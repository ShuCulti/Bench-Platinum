name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  build-and-test:
    services:
      postgres:
        image: postgres:17
        env: 
          POSTGRES_DB: platinum_bench
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory:
          platinum-bench-backend

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and run tests
        env:
          DB_PASSWORD: ci-password 
        run: ./gradlew build --no-daemon
        
      - name: Run gradlew sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN}}
        run: ./gradlew sonar 

  docker-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    # GITHUB_TOKEN gets permission to push to this repo's packages (GHCR).
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pull requests only build the image to check the Dockerfile still works.
      # A push to main also logs in and publishes it, which is what the
      # EduCloud VM pulls.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ./platinum-bench-backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/shuculti/platinum-bench-backend:latest
            ghcr.io/shuculti/platinum-bench-backend:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: platinum-bench-frontend

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platinum-bench-frontend/package-lock.json

      - name: install dependencies
        run: npm ci

      - name: npm lint test
        run: npm run lint

      - name: build 
        run: npm run build
