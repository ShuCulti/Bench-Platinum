name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  build-and-test:
    services:
      postgres:
        image: postgres:17
        env: 
          POSTGRES_DB: platinum_bench
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory:
          platinum-bench-backend

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and run tests
        env:
          DB_PASSWORD: ci-password 
        run: ./gradlew build --no-daemon
        
      - name: Run gradlew sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN}}
        run: ./gradlew sonar 

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t platinum-bench-backend ./platinum-bench-backend

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: platinum-bench-frontend

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platinum-bench-frontend/package-lock.json

      - name: install dependencies
        run: npm ci

      - name: npm lint test
        run: npm run lint

      - name: build 
        run: npm run build
