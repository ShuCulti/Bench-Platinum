name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory:
          platinum-bench-backend

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory:
          platinum-bench-backend

      - name: Build and run tests
        run: ./gradlew build --no-daemon
        working-directory:
          platinum-bench-backend

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t platinum-bench-backend ./platinum-bench-backend